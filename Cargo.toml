[workspace]
resolver = "2"
members = ["crates/core", "crates/helper", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/example/mirrorscope"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
toml = "1"
mirrorscope-core = { path = "crates/core" }
mirrorscope-cli = { path = "crates/cli" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = "s"
panic = "abort"
